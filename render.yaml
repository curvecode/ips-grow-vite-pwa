services:
  - type: web
    name: ips-grow-backend
    branch: angular-21-demo
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/history/summary?source=thebank

  - type: web
    name: ips-grow-frontend
    branch: angular-21-demo
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ips-grow-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
